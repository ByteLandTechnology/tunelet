<svg id="lifecycle-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" width="460" height="580" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
  <title id="lifecycle-title">The processor lifecycle</title>
  <desc id="lifecycle-desc">Processor::new validates the configuration and allocates all storage. In the real-time area, process calls render one frame for each sample. After begin_drain(), drain calls return frames from tail_frames() until the last call runs reset(). A process call, set_config() or reset() cancels an active drain.</desc>
  <style>
    svg {
      max-width: 100%;
      height: auto;
      display: block;
      --bg: #ffffff;
      --fill: #f6f8fa;
      --text: #1f2328;
      --muted: #424a53;
      --line: #57606a;
      --accent: #0550ae;
      --accent-fill: #ddf4ff;
      --event: #6639ba;
      --event-fill: #fbefff;
      --warn: #7d4e00;
      --ok: #116329;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --fill: #161b22;
        --text: #e6edf3;
        --muted: #b1bac4;
        --line: #8b949e;
        --accent: #79c0ff;
        --accent-fill: #0c2d52;
        --event: #d2a8ff;
        --event-fill: #2b1d47;
        --warn: #e3b341;
        --ok: #56d364;
      }
    }
    .bg { fill: var(--bg); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .name { font-size: 16px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 14px; }
    .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.5; }
    .state { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.5; }
    .zone { fill: none; stroke: var(--ok); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .zone-text { font-size: 14px; font-weight: 600; fill: var(--ok); }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .cancel { fill: none; stroke: var(--warn); stroke-width: 1.5; }
    .head { fill: var(--line); }
    .warn-head { fill: var(--warn); }
    .warn-line { font-size: 14px; fill: var(--warn); }
  </style>
  <defs>
    <marker id="lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="lifecycle-warn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="warn-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="460" height="580" rx="10"/>

  <!-- Construction -->
  <rect class="node" x="36" y="16" width="340" height="88" rx="10"/>
  <text class="name" x="206" y="44"><tspan class="code">Processor::new</tspan></text>
  <text class="sub" x="206" y="68">validates the configuration</text>
  <text class="sub" x="206" y="88">allocates all storage</text>

  <!-- Real-time zone -->
  <rect class="zone" x="16" y="124" width="428" height="440" rx="14"/>
  <path class="wire" d="M68,104 V170" marker-end="url(#lifecycle-arrow)"/>
  <text class="zone-text" x="88" y="150">No memory allocation, no locks and no I/O</text>

  <!-- Process state -->
  <rect class="state" x="36" y="172" width="340" height="120" rx="12"/>
  <text class="name" x="206" y="200">Process</text>
  <text class="sub code" x="206" y="224">process*(), set_config()</text>
  <text class="sub code" x="206" y="246">feedback(), telemetry()</text>
  <text class="sub" x="206" y="270">one output frame for each input sample</text>

  <!-- Transitions between Process and Drain -->
  <path class="wire" d="M76,292 V374" marker-end="url(#lifecycle-arrow)"/>
  <text class="label code" x="88" y="338">begin_drain()</text>

  <path class="cancel" d="M226,376 V294" marker-end="url(#lifecycle-warn-arrow)"/>
  <text class="warn-line" x="238" y="322">a process call,</text>
  <text class="warn-line" x="238" y="341"><tspan class="code">set_config</tspan> or <tspan class="code">reset</tspan></text>
  <text class="warn-line" x="238" y="360">cancels the drain</text>

  <!-- Drain state -->
  <rect class="state" x="36" y="376" width="340" height="124" rx="12"/>
  <text class="name" x="206" y="402">Drain</text>
  <text class="sub" x="206" y="426"><tspan class="code">drain*()</tspan> returns <tspan class="code">n</tspan>; use only <tspan class="code">output[..n]</tspan></text>
  <text class="sub" x="206" y="448">zeros fill the other frames</text>
  <text class="sub" x="206" y="470">finite budget: <tspan class="code">tail_frames()</tspan></text>
  <text class="sub" x="206" y="490">next drain calls return 0</text>

  <!-- Budget completion loop -->
  <path class="wire" d="M206,500 V518 H420 V232 H378" marker-end="url(#lifecycle-arrow)"/>
  <text class="label" x="230" y="546" text-anchor="middle">Last drain call uses budget and runs <tspan class="code">reset()</tspan></text>
</svg>
