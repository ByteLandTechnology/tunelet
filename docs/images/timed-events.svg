<svg id="timed-events-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 468" width="460" height="468" role="img" aria-labelledby="timed-events-title timed-events-desc">
  <title id="timed-events-title">Timed events in a block of 16 frames</title>
  <desc id="timed-events-desc">The block has 16 frames, from 0 to 15. The outputGain event runs at 0, midi Note On runs before reverb in slice order at 5, and reset runs at 11. Each event applies immediately before the frame at its offset.</desc>
  <style>
    svg {
      max-width: 100%;
      height: auto;
      display: block;
      --bg: #ffffff;
      --fill: #f6f8fa;
      --text: #1f2328;
      --muted: #424a53;
      --line: #57606a;
      --accent: #0550ae;
      --accent-fill: #ddf4ff;
      --event: #6639ba;
      --event-fill: #fbefff;
      --warn: #7d4e00;
      --ok: #116329;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --fill: #161b22;
        --text: #e6edf3;
        --muted: #b1bac4;
        --line: #8b949e;
        --accent: #79c0ff;
        --accent-fill: #0c2d52;
        --event: #d2a8ff;
        --event-fill: #2b1d47;
        --warn: #e3b341;
        --ok: #56d364;
      }
    }
    .bg { fill: var(--bg); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .event { fill: var(--event-fill); stroke: var(--event); stroke-width: 1.5; }
    .event-text { font-size: 14px; text-anchor: middle; }
    .frame { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.2; }
    .tick { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); }
    .rule-title { font-size: 15px; font-weight: 600; }
    .event-wire { fill: none; stroke: var(--event); stroke-width: 1.5; }
    .event-head { fill: var(--event); }
  </style>
  <defs>
    <marker id="timed-events-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="event-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="460" height="468" rx="10"/>

  <!-- Events in frames 0..7 -->
  <rect class="event" x="16" y="16" width="168" height="32" rx="6"/>
  <text class="event-text" x="100" y="37"><tspan class="code">outputGain</tspan> at 0</text>
  <path class="event-wire" d="M22,48 V128" marker-end="url(#timed-events-arrow)"/>
  <text class="note" x="34" y="116">Frames 0 to 7</text>

  <rect class="event" x="216" y="16" width="228" height="32" rx="6"/>
  <text class="event-text" x="330" y="37">1. <tspan class="code">midi</tspan> Note On at 5</text>
  <rect class="event" x="216" y="54" width="228" height="32" rx="6"/>
  <text class="event-text" x="330" y="75">2. <tspan class="code">reverb</tspan> change at 5</text>
  <path class="event-wire" d="M282,86 V128" marker-end="url(#timed-events-arrow)"/>
  <text class="note" x="444" y="116" text-anchor="end">same offset: slice order</text>

  <!-- Frame row 0..7 -->
  <g>
    <rect class="frame" x="22" y="130" width="52" height="38"/>
    <rect class="frame" x="74" y="130" width="52" height="38"/>
    <rect class="frame" x="126" y="130" width="52" height="38"/>
    <rect class="frame" x="178" y="130" width="52" height="38"/>
    <rect class="frame" x="230" y="130" width="52" height="38"/>
    <rect class="frame" x="282" y="130" width="52" height="38"/>
    <rect class="frame" x="334" y="130" width="52" height="38"/>
    <rect class="frame" x="386" y="130" width="52" height="38"/>
  </g>
  <text class="tick" x="48" y="188">0</text>
  <text class="tick" x="100" y="188">1</text>
  <text class="tick" x="152" y="188">2</text>
  <text class="tick" x="204" y="188">3</text>
  <text class="tick" x="256" y="188">4</text>
  <text class="tick" x="308" y="188">5</text>
  <text class="tick" x="360" y="188">6</text>
  <text class="tick" x="412" y="188">7</text>

  <!-- Event in frames 8..15 -->
  <text class="note" x="22" y="262">Frames 8 to 15</text>
  <rect class="event" x="164" y="214" width="148" height="32" rx="6"/>
  <text class="event-text" x="238" y="235"><tspan class="code">reset</tspan> at 11</text>
  <path class="event-wire" d="M178,246 V274" marker-end="url(#timed-events-arrow)"/>

  <!-- Frame row 8..15 -->
  <g>
    <rect class="frame" x="22" y="276" width="52" height="38"/>
    <rect class="frame" x="74" y="276" width="52" height="38"/>
    <rect class="frame" x="126" y="276" width="52" height="38"/>
    <rect class="frame" x="178" y="276" width="52" height="38"/>
    <rect class="frame" x="230" y="276" width="52" height="38"/>
    <rect class="frame" x="282" y="276" width="52" height="38"/>
    <rect class="frame" x="334" y="276" width="52" height="38"/>
    <rect class="frame" x="386" y="276" width="52" height="38"/>
  </g>
  <text class="tick" x="48" y="334">8</text>
  <text class="tick" x="100" y="334">9</text>
  <text class="tick" x="152" y="334">10</text>
  <text class="tick" x="204" y="334">11</text>
  <text class="tick" x="256" y="334">12</text>
  <text class="tick" x="308" y="334">13</text>
  <text class="tick" x="360" y="334">14</text>
  <text class="tick" x="412" y="334">15</text>

  <!-- Rules -->
  <text class="rule-title" x="22" y="374">An event applies immediately before its offset frame.</text>
  <text class="note" x="22" y="400">Offsets start at 0, stay in the block and do not decrease.</text>
  <text class="note" x="22" y="424">If an event is not valid, the call fails without changes</text>
  <text class="note" x="22" y="446">to the output or the state.</text>
</svg>
