<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 336" width="1260" height="336" role="img" aria-labelledby="title desc">
  <title id="title">The tunelet signal chain</title>
  <desc id="desc">Mono PCM goes through Punch, Warm, pitch tracking and resynthesis, Alien, reverb, the output gain, the global mix and the global bypass. One dry path goes around resynthesis, and a raw dry path before Punch feeds the global mix and the global bypass.</desc>
  <style>
    svg { --bg: #ffffff; --text: #1f2328; --muted: #59636e; --line: #656d76; --fill: #f6f8fa; --accent: #0969da; --accent-fill: #ddf4ff; --dry: #9a6700; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --text: #e6edf3; --muted: #9198a1; --line: #7d8590; --fill: #161b22; --accent: #58a6ff; --accent-fill: #0c2d52; --dry: #d29922; }
    }
    .bg { fill: var(--bg); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .name { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .title { font-size: 14px; font-weight: 600; fill: var(--accent); text-anchor: middle; }
    .note { font-size: 12px; fill: var(--muted); }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.5; }
    .off { stroke-dasharray: 5 4; }
    .io { fill: none; stroke: var(--text); stroke-width: 1.5; }
    .stage { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.5; }
    .inner { fill: var(--fill); stroke: var(--accent); stroke-width: 1.2; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .dry { fill: none; stroke: var(--dry); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .head { fill: var(--line); }
    .dryhead { fill: var(--dry); }
    .drytext { font-size: 12px; fill: var(--dry); text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="dryarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dryhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="100%" height="100%" fill="#ffffff"/>

  <!-- Input -->
  <rect class="io" x="10" y="82" width="100" height="56" rx="28"/>
  <text class="name" x="60" y="106">Input</text>
  <text class="sub" x="60" y="124">mono i16 PCM</text>

  <!-- Punch and Warm -->
  <rect class="node off" x="138" y="82" width="76" height="56" rx="8"/>
  <text class="name" x="176" y="106">Punch</text>
  <text class="sub" x="176" y="124">dynamics</text>
  <rect class="node off" x="234" y="82" width="72" height="56" rx="8"/>
  <text class="name" x="270" y="106">Warm</text>
  <text class="sub" x="270" y="124">drive</text>

  <!-- Resynthesis stage -->
  <rect class="stage" x="336" y="28" width="316" height="160" rx="12"/>
  <text class="title" x="494" y="52">Pitch tracking and resynthesis</text>
  <rect class="inner" x="348" y="86" width="78" height="48" rx="6"/>
  <text class="name" x="387" y="106" style="font-size:13px">Pitch</text>
  <text class="sub" x="387" y="123">tracker</text>
  <rect class="inner" x="438" y="86" width="92" height="48" rx="6"/>
  <text class="name" x="484" y="106" style="font-size:13px">Correction</text>
  <text class="sub" x="484" y="123">scale or MIDI</text>
  <rect class="inner" x="542" y="86" width="98" height="48" rx="6"/>
  <text class="name" x="591" y="106" style="font-size:13px">Voices</text>
  <text class="sub" x="591" y="123">choir or harmony</text>
  <rect class="inner off" x="438" y="146" width="202" height="30" rx="6"/>
  <text class="sub" x="539" y="166">Formant (LPC) and aspiration</text>
  <path class="wire" d="M426,110 H436" marker-end="url(#arrow)"/>
  <path class="wire" d="M530,110 H540" marker-end="url(#arrow)"/>
  <path class="wire" d="M591,146 V136" marker-end="url(#arrow)"/>

  <!-- Alien, reverb, gain, mix, bypass -->
  <rect class="node off" x="682" y="82" width="84" height="56" rx="8"/>
  <text class="name" x="724" y="106">Alien</text>
  <text class="sub" x="724" y="124">reverse loop</text>
  <rect class="node off" x="786" y="82" width="76" height="56" rx="8"/>
  <text class="name" x="824" y="106">Reverb</text>
  <text class="sub" x="824" y="124">6 modes</text>
  <rect class="node" x="882" y="82" width="64" height="56" rx="8"/>
  <text class="name" x="914" y="106">Gain</text>
  <text class="sub" x="914" y="124">0..=64</text>
  <rect class="node" x="966" y="82" width="64" height="56" rx="8"/>
  <text class="name" x="998" y="106">Mix</text>
  <text class="sub" x="998" y="124">0..=1</text>
  <rect class="node off" x="1050" y="82" width="80" height="56" rx="8"/>
  <text class="name" x="1090" y="106">Bypass</text>
  <text class="sub" x="1090" y="124">crossfade</text>

  <!-- Output -->
  <rect class="io" x="1150" y="82" width="100" height="56" rx="28"/>
  <text class="name" x="1200" y="106">Output</text>
  <text class="sub" x="1200" y="124">stereo or mono</text>

  <!-- Main wires -->
  <path class="wire" d="M110,110 H136" marker-end="url(#arrow)"/>
  <path class="wire" d="M214,110 H232" marker-end="url(#arrow)"/>
  <path class="wire" d="M306,110 H346" marker-end="url(#arrow)"/>
  <path class="wire" d="M640,110 H680" marker-end="url(#arrow)"/>
  <path class="wire" d="M766,110 H784" marker-end="url(#arrow)"/>
  <path class="wire" d="M862,110 H880" marker-end="url(#arrow)"/>
  <path class="wire" d="M946,110 H964" marker-end="url(#arrow)"/>
  <path class="wire" d="M1030,110 H1048" marker-end="url(#arrow)"/>
  <path class="wire" d="M1130,110 H1148" marker-end="url(#arrow)"/>

  <!-- Resynthesis dry path -->
  <circle cx="321" cy="110" r="3.5" fill="var(--dry)"/>
  <circle cx="667" cy="110" r="3.5" fill="var(--dry)"/>
  <path class="dry" d="M321,110 V214 H667 V114" marker-end="url(#dryarrow)"/>
  <text class="drytext" x="494" y="232"><tspan class="code">dry_mix</tspan>: dry path after Warm, 1,593 frames of delay (default 0)</text>

  <!-- Global dry path -->
  <circle cx="122" cy="110" r="3.5" fill="var(--dry)"/>
  <circle cx="998" cy="258" r="3.5" fill="var(--dry)"/>
  <path class="dry" d="M122,110 V258 H1090 V140" marker-end="url(#dryarrow)"/>
  <path class="dry" d="M998,258 V140" marker-end="url(#dryarrow)"/>
  <text class="drytext" x="606" y="276"><tspan class="code">mix</tspan> and <tspan class="code">bypass</tspan>: raw dry path before Punch, 1,593 frames of delay</text>

  <!-- Legend -->
  <rect class="node" x="10" y="304" width="26" height="16" rx="4"/>
  <text class="note" x="44" y="317">enabled by default</text>
  <rect class="node off" x="170" y="304" width="26" height="16" rx="4"/>
  <text class="note" x="204" y="317">disabled by default</text>
  <text class="note" x="1250" y="317" text-anchor="end">Nominal latency: 1,593 frames at 44.1 kHz and 48 kHz</text>
</svg>
