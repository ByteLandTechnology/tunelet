<svg id="signal-chain-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 568" width="460" height="568" role="img" aria-labelledby="signal-chain-title signal-chain-desc">
  <title id="signal-chain-title">The tunelet signal chain</title>
  <desc id="signal-chain-desc">Mono signed 16-bit PCM goes through Punch, Warm, pitch tracking and resynthesis, Alien, reverb and the output gain. A dry path with 1,543 frames of delay goes around the resynthesis stage.</desc>
  <style>
    svg {
      max-width: 100%;
      height: auto;
      display: block;
      --bg: #ffffff;
      --fill: #f6f8fa;
      --text: #1f2328;
      --muted: #424a53;
      --line: #57606a;
      --accent: #0550ae;
      --accent-fill: #ddf4ff;
      --event: #6639ba;
      --event-fill: #fbefff;
      --warn: #7d4e00;
      --ok: #116329;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --fill: #161b22;
        --text: #e6edf3;
        --muted: #b1bac4;
        --line: #8b949e;
        --accent: #79c0ff;
        --accent-fill: #0c2d52;
        --event: #d2a8ff;
        --event-fill: #2b1d47;
        --warn: #e3b341;
        --ok: #56d364;
      }
    }
    .bg { fill: var(--bg); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .name { font-size: 16px; font-weight: 600; text-anchor: middle; }
    .inner-name { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .heading { font-size: 16px; font-weight: 600; fill: var(--accent); text-anchor: middle; }
    .note { font-size: 14px; fill: var(--muted); }
    .warn-text { font-size: 14px; fill: var(--warn); text-anchor: middle; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .node { fill: var(--fill); stroke: var(--line); stroke-width: 1.5; }
    .off { stroke-dasharray: 5 4; }
    .io { fill: var(--fill); stroke: var(--text); stroke-width: 1.5; }
    .stage { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.5; }
    .inner { fill: var(--fill); stroke: var(--accent); stroke-width: 1.5; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .dry { fill: none; stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .head { fill: var(--line); }
    .warn-head { fill: var(--warn); }
  </style>
  <defs>
    <marker id="signal-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="signal-chain-dry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="warn-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="460" height="568" rx="10"/>

  <!-- Input, Punch, Warm -->
  <rect class="io" x="16" y="16" width="128" height="58" rx="29"/>
  <text class="name" x="80" y="41">Input</text>
  <text class="sub" x="80" y="60">mono i16 PCM</text>

  <rect class="node off" x="166" y="16" width="128" height="58" rx="8"/>
  <text class="name" x="230" y="41">Punch</text>
  <text class="sub" x="230" y="60">dynamics</text>

  <rect class="node off" x="316" y="16" width="128" height="58" rx="8"/>
  <text class="name" x="380" y="41">Warm</text>
  <text class="sub" x="380" y="60">drive</text>

  <path class="wire" d="M144,45 H164" marker-end="url(#signal-chain-arrow)"/>
  <path class="wire" d="M294,45 H314" marker-end="url(#signal-chain-arrow)"/>
  <path class="wire" d="M380,74 V92 H212 V110" marker-end="url(#signal-chain-arrow)"/>

  <!-- Resynthesis stage -->
  <rect class="stage" x="16" y="112" width="392" height="182" rx="12"/>
  <text class="heading" x="212" y="138">Pitch tracking and resynthesis</text>

  <rect class="inner" x="28" y="152" width="88" height="58" rx="6"/>
  <text class="inner-name" x="72" y="177">Pitch</text>
  <text class="sub" x="72" y="197">tracker</text>

  <rect class="inner" x="132" y="152" width="116" height="58" rx="6"/>
  <text class="inner-name" x="190" y="177">Correction</text>
  <text class="sub" x="190" y="197">scale or MIDI</text>

  <rect class="inner" x="264" y="152" width="132" height="58" rx="6"/>
  <text class="inner-name" x="330" y="177">Voices</text>
  <text class="sub" x="330" y="197">choir or harmony</text>

  <rect class="inner off" x="132" y="232" width="264" height="42" rx="6"/>
  <text class="sub" x="264" y="258">Formant (LPC) and aspiration</text>

  <path class="wire" d="M116,181 H130" marker-end="url(#signal-chain-arrow)"/>
  <path class="wire" d="M248,181 H262" marker-end="url(#signal-chain-arrow)"/>
  <path class="wire" d="M330,232 V212" marker-end="url(#signal-chain-arrow)"/>

  <!-- Dry path and post-resynthesis wire -->
  <path class="wire" d="M80,294 V350" marker-end="url(#signal-chain-arrow)"/>
  <circle cx="380" cy="92" r="3.5" fill="var(--warn)"/>
  <circle cx="80" cy="316" r="3.5" fill="var(--warn)"/>
  <path class="dry" d="M380,92 H432 V316 H86" marker-end="url(#signal-chain-dry-arrow)"/>
  <text class="warn-text" x="266" y="338"><tspan class="code">dry_mix</tspan>: dry path, 1,543 frames (default 0)</text>

  <!-- Alien, Reverb, Gain -->
  <rect class="node off" x="16" y="352" width="128" height="58" rx="8"/>
  <text class="name" x="80" y="377">Alien</text>
  <text class="sub" x="80" y="396">reverse loop</text>

  <rect class="node off" x="166" y="352" width="128" height="58" rx="8"/>
  <text class="name" x="230" y="377">Reverb</text>
  <text class="sub" x="230" y="396">6 modes</text>

  <rect class="node" x="316" y="352" width="128" height="58" rx="8"/>
  <text class="name" x="380" y="377">Gain</text>
  <text class="sub" x="380" y="396">0..=64</text>

  <path class="wire" d="M144,381 H164" marker-end="url(#signal-chain-arrow)"/>
  <path class="wire" d="M294,381 H314" marker-end="url(#signal-chain-arrow)"/>

  <!-- Output -->
  <path class="wire" d="M380,410 V430" marker-end="url(#signal-chain-arrow)"/>
  <rect class="io" x="300" y="432" width="144" height="58" rx="29"/>
  <text class="name" x="372" y="457">Output</text>
  <text class="sub" x="372" y="476">stereo or mono</text>

  <!-- Legend and latency -->
  <rect class="node" x="16" y="510" width="28" height="18" rx="4"/>
  <text class="note" x="52" y="524">enabled by default</text>
  <rect class="node off" x="228" y="510" width="28" height="18" rx="4"/>
  <text class="note" x="264" y="524">disabled by default</text>
  <text class="note" x="16" y="552">Nominal latency: 1,593 frames at 44.1 kHz and 48 kHz</text>
</svg>
