# Continuous integration for the Rust crate, the Wasm bindings and the
# npm package.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      # Read the wasm-bindgen version from Cargo.lock for the cache key.
      - id: wasm-bindgen
        run: |
          version=$(awk '
            $0 == "[[package]]" { in_pkg = 0 }
            $0 == "name = \"wasm-bindgen\"" { in_pkg = 1; next }
            in_pkg && /^version = "/ {
              sub(/^version = "/, "")
              sub(/"$/, "")
              print
              exit
            }
          ' Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: wasm-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/wasm-tools/bin
            ~/.cache/.wasm-pack
          key: wasm-tools-${{ runner.os }}-${{ runner.arch }}-wasm-pack-0.15.1-binaryen-133-wasm-bindgen-${{ steps.wasm-bindgen.outputs.version }}
      - if: ${{ steps.wasm-tools-cache.outputs.cache-hit != 'true' }}
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasm-pack@0.15.1
          checksum: true
      # Copy wasm-pack and extract Binaryen wasm-opt 133 into the cache.
      - if: ${{ steps.wasm-tools-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$HOME/.cache/wasm-tools/bin"
          cp "$(command -v wasm-pack)" "$HOME/.cache/wasm-tools/bin/wasm-pack"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$HOME/.cache/wasm-tools/bin" --strip-components=2 binaryen-version_133/bin/wasm-opt
          rm -f "$RUNNER_TEMP/binaryen.tar.gz"
      - run: echo "$HOME/.cache/wasm-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: cargo fmt --check
      - run: cargo clippy --locked --lib -- -D warnings
      - run: cargo build --locked --release
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo package --list --locked
      - run: npm ci
      - run: npm run check:wasm
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: npm run verify:pack
