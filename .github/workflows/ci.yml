# Continuous integration for the Rust crate, the Wasm bindings and the
# npm package.
#
# First, build-wasm checks the Rust lints, the docs, the crate archive and the
# Wasm target on Linux, then uploads pkg/. Next, check-os builds the native
# library, compiles TypeScript and checks the npm archives on Linux, macOS and
# Windows. Last, verify reports one status check for branch protection.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasm-pack@0.15.1
          checksum: true
      # Install Binaryen wasm-opt 133 and verify its SHA-256 checksum.
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: cargo fmt --check
      - run: cargo clippy --locked --lib -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo package --locked
      - run: npm run check:wasm
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: npm run build:wasm
      # Upload the built pkg/ files for the cross-OS matrix.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: |
            pkg/tunelet.js
            pkg/tunelet.d.ts
            pkg/tunelet_bg.wasm
          retention-days: 1
          if-no-files-found: error

  check-os:
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            cdylib: target/release/libtunelet.so
          - os: macos-latest
            cdylib: target/release/libtunelet.dylib
          - os: windows-latest
            cdylib: target/release/tunelet.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: pkg
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: cargo build --locked --release
      # Check that Cargo built the native dynamic library for this OS.
      - run: node --input-type=module -e "import assert from 'node:assert/strict'; import fs from 'node:fs'; const stat = fs.statSync(process.env.CDYLIB); assert.ok(stat.isFile() && stat.size > 0);"
        env:
          CDYLIB: ${{ matrix.cdylib }}
      - run: npm ci
      - run: npm run build:ts
      # Pack and check the pre-built files without a second Wasm build.
      - run: npm run verify:pack -- --ignore-scripts

  verify:
    needs:
      - build-wasm
      - check-os
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail if build-wasm or check-os did not succeed.
      - run: |
          if [ "${BUILD_WASM}" != "success" ] || [ "${CHECK_OS}" != "success" ]; then
            echo "Upstream job results: build-wasm=${BUILD_WASM}, check-os=${CHECK_OS}" >&2
            exit 1
          fi
        env:
          BUILD_WASM: ${{ needs.build-wasm.result }}
          CHECK_OS: ${{ needs.check-os.result }}
