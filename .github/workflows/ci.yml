# Continuous integration for the Rust crate, the Wasm bindings and the
# npm package.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-wasm
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --lib -- -D warnings
      - run: cargo build --locked --release
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo package --locked
      - run: npm ci
      - run: npm run check:wasm
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: npm run verify:pack

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install rust-version from Cargo.toml.
      - run: |
          msrv="$(sed -n 's/^rust-version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "Cargo.toml does not set rust-version" >&2
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal --no-self-update --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      - run: cargo build --locked --lib
      - run: cargo build --locked --lib --target wasm32-unknown-unknown --features wasm
