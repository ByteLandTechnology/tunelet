# Release automation with release-please, an unprivileged build job and
# isolated environment jobs.
#
# Each push to main updates the release pull request. When you merge that
# pull request, release-please creates the tag and the GitHub release. Then
# build-release checks the crate package and packs both npm archives without
# write permissions.
#
# Three jobs publish the release from dedicated GitHub Environments:
# - publish-npm publishes tunelet to npmjs.org through OIDC.
# - publish-github publishes @bytelandtechnology/tunelet to GitHub Packages.
# - publish-crate publishes the crate to crates.io through OIDC.
#
# The trusted publishers on npmjs.org and crates.io must name release.yml
# and the npm and crates-io environments.
name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      npm_sha256: ${{ steps.pack-npm.outputs.sha256 }}
      github_sha256: ${{ steps.pack-github.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.1 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - run: npm ci
      - run: cargo package --locked
      # The prepack script compiles the Wasm bindings and the TypeScript entry.
      - id: pack-npm
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          mv "$RUNNER_TEMP/npm-package"/tunelet-*.tgz "$RUNNER_TEMP/npm-package/npm-package.tgz"
          sha256=$(sha256sum "$RUNNER_TEMP/npm-package/npm-package.tgz" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf 'npm-package.tgz: `%s`\n' "$sha256" >> "$GITHUB_STEP_SUMMARY"
      # GitHub Packages accepts only names in the scope of the owner.
      - id: pack-github
        run: |
          mkdir -p "$RUNNER_TEMP/github-package"
          npm pkg set name=@bytelandtechnology/tunelet
          npm pack --pack-destination "$RUNNER_TEMP/github-package"
          mv "$RUNNER_TEMP/github-package"/bytelandtechnology-tunelet-*.tgz "$RUNNER_TEMP/github-package/github-package.tgz"
          sha256=$(sha256sum "$RUNNER_TEMP/github-package/github-package.tgz" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf 'github-package.tgz: `%s`\n' "$sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-tgz
          path: ${{ runner.temp }}/npm-package/npm-package.tgz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-package-tgz
          path: ${{ runner.temp }}/github-package/github-package.tgz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-tgz
          path: ${{ runner.temp }}/npm-package
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/npm-package/npm-package.tgz" | sha256sum --check --strict
        env:
          EXPECTED_SHA256: ${{ needs.build-release.outputs.npm_sha256 }}
      - run: npm publish "$RUNNER_TEMP/npm-package/npm-package.tgz" --ignore-scripts

  publish-github:
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-packages
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-package-tgz
          path: ${{ runner.temp }}/github-package
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bytelandtechnology"
          package-manager-cache: false
      - run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/github-package/github-package.tgz" | sha256sum --check --strict
        env:
          EXPECTED_SHA256: ${{ needs.build-release.outputs.github_sha256 }}
      - run: npm publish "$RUNNER_TEMP/github-package/github-package.tgz" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # The action gets a short-lived crates.io token through OIDC. It
      # revokes the token when the job ends.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
