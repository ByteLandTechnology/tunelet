# Release management with release-please, and publication to npm, crates.io
# and GitHub Packages.
#
# Concurrency puts runs on main in a queue and does not cancel active runs.
# Each push to main updates the release pull request. When you merge the
# release pull request, release-please makes the tag and the GitHub release.
# Then verify-release checks the crate and both npm scopes, and uploads the
# built package files. If verify-release succeeds, three jobs publish the
# release in parallel.
#
# Two jobs publish through OIDC: publish-npm publishes the npm package, and
# publish-crate publishes the crate to crates.io. The trusted publishers on
# npm and on crates.io must name this file (release.yml). Those two jobs do
# not use stored tokens.
#
# The publish-github job packs @bytelandtechnology/tunelet from the uploaded
# files and writes a SHA-256 checksum file. It attests the archive, publishes
# it to GitHub Packages and uploads the archive and the checksum to the GitHub
# release. It uses the GITHUB_TOKEN of the workflow. GitHub links the package
# to this repository through the repository field.
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  verify-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasm-pack@0.15.1
          checksum: true
      # Install Binaryen wasm-opt 133 and verify its SHA-256 checksum.
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: cargo publish --dry-run --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: npm ci
      # Check the unscoped and scoped archives before upload.
      - run: npm run verify:pack
      - run: npm pkg set name=@bytelandtechnology/tunelet
      - run: npm run verify:pack
      - run: npm pkg set name=tunelet
      # Upload the built dist/ and pkg/ files for the publish jobs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-package-dist
          path: |
            dist/
            pkg/tunelet.js
            pkg/tunelet.d.ts
            pkg/tunelet_bg.wasm
          retention-days: 1
          if-no-files-found: error

  publish-npm:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-package-dist
          path: .
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global --ignore-scripts npm@latest
      # Publish the built files without a second prepack build.
      - run: npm publish --ignore-scripts

  publish-github:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-package-dist
          path: .
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bytelandtechnology"
      # GitHub Packages accepts only names in the scope of the owner.
      - run: npm pkg set name=@bytelandtechnology/tunelet
      # Pack the built files without a second prepack build.
      - id: pack
        run: |
          output=$(npm pack --ignore-scripts)
          archive=${output##*$'\n'}
          sha256sum "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.archive }}
      - run: npm publish --ignore-scripts "./$PACKAGE_ARCHIVE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ARCHIVE: ${{ steps.pack.outputs.archive }}
      - run: gh release upload "$TAG_NAME" "./$PACKAGE_ARCHIVE" "./${PACKAGE_ARCHIVE}.sha256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ARCHIVE: ${{ steps.pack.outputs.archive }}

  publish-crate:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # The action gets a short-lived crates.io token through OIDC. It
      # revokes the token when the job ends.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
