# Release management with release-please and npm trusted publishing.
#
# Each push to main updates the release pull request. When you merge the
# release pull request, release-please makes the tag and the GitHub release.
# Then the publish job publishes the npm package through OIDC. The npm
# trusted publisher for this package must name this file (release.yml).
name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: npm ci
      # The prepack script builds the Wasm bindings and the TypeScript entry.
      - run: npm publish
