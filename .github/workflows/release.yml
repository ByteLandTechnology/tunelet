# Release management with release-please, and trusted publishing to npm and
# crates.io.
#
# Concurrency puts runs on main in a queue and does not cancel active runs.
# Each push to main updates the release pull request. When you merge the
# release pull request, release-please makes the tag and the GitHub release.
# Then build-wasm builds, checks and uploads both .tgz archives and
# SHA256SUMS.txt. After that, publish-npm and publish-github verify
# SHA256SUMS.txt and publish those archives, and publish-crate publishes to
# crates.io.
#
# Both publish-npm and publish-crate authenticate through OIDC, and
# publish-github authenticates with GITHUB_TOKEN. The OIDC policies on npm and
# on crates.io must name this file (release.yml). GitHub links
# @bytelandtechnology/tunelet to this repository through the repository field.
# The release-please job uses the default GITHUB_TOKEN.
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build-wasm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: ./.github/actions/setup-wasm
      - run: npm ci
      # Build and check both archives, then write SHA256SUMS.txt.
      - run: npm run verify:pack -- --out-dir "$RUNNER_TEMP/wasm-package-dist"
      # Upload both verified archives and SHA256SUMS.txt for the publish jobs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-package-dist
          path: |
            ${{ runner.temp }}/wasm-package-dist/tunelet-*.tgz
            ${{ runner.temp }}/wasm-package-dist/bytelandtechnology-tunelet-*.tgz
            ${{ runner.temp }}/wasm-package-dist/SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error

  publish-npm:
    needs: [release-please, build-wasm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-package-dist
          path: .
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global --ignore-scripts npm@latest
      # Check SHA256SUMS.txt and publish the verified unscoped archive.
      - run: |
          sha256sum --check --strict SHA256SUMS.txt
          npm publish --ignore-scripts "./tunelet-${TAG_NAME#v}.tgz"
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

  publish-github:
    needs: [release-please, build-wasm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-package-dist
          path: .
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bytelandtechnology"
      # Check SHA256SUMS.txt and publish the verified scoped archive.
      - run: |
          sha256sum --check --strict SHA256SUMS.txt
          npm publish --ignore-scripts "./bytelandtechnology-tunelet-${TAG_NAME#v}.tgz"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

  publish-crate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # The action gets a short-lived crates.io token through OIDC. It
      # revokes the token when the job ends.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
