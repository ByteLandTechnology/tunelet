# Release management with release-please, and publication to npm, crates.io
# and GitHub Packages.
#
# Concurrency puts runs on main in a queue and does not cancel an active run.
# Each push to main updates the release pull request. When you merge the
# release pull request, release-please makes the tag and the GitHub release.
# Then verify-release checks the crate and both npm scopes with read
# permission. If verify-release succeeds, three jobs publish the release in
# parallel.
#
# Two jobs publish through OIDC: publish-npm publishes the npm package, and
# publish-crate publishes the crate to crates.io. The trusted publishers on
# npm and on crates.io must name this file (release.yml). Those two jobs do
# not use stored tokens.
#
# The publish-github job checks and packs @bytelandtechnology/tunelet and
# writes a SHA-256 checksum file. It attests the archive, publishes it to
# GitHub Packages and uploads the archive and the checksum to the GitHub
# release. It uses the GITHUB_TOKEN of the workflow. GitHub links the package
# to this repository through the repository field.
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  verify-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-opt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: cargo publish --dry-run --locked
      - run: cargo doc --locked --no-deps
      - run: npm ci
      - run: npm run verify:pack
      - run: npm pkg set name=@bytelandtechnology/tunelet
      - run: npm run verify:pack

  publish-npm:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-opt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: npm ci
      # Check the archive files and loadTunelet() before npm publish.
      - run: npm run verify:pack
      # Publish the built files without a second prepack build.
      - run: npm publish --ignore-scripts

  publish-github:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-opt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bytelandtechnology"
          cache: "npm"
      - run: npm ci
      # GitHub Packages accepts only names in the scope of the owner.
      - run: npm pkg set name=@bytelandtechnology/tunelet
      # Check the archive files and loadTunelet() before npm publish.
      - run: npm run verify:pack
      # Pack the built files without a second prepack build.
      - id: pack
        run: |
          output=$(npm pack --ignore-scripts)
          archive=${output##*$'\n'}
          sha256sum "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.archive }}
      - run: npm publish --ignore-scripts "./$PACKAGE_ARCHIVE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ARCHIVE: ${{ steps.pack.outputs.archive }}
      - run: gh release upload "$TAG_NAME" "./$PACKAGE_ARCHIVE" "./${PACKAGE_ARCHIVE}.sha256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ARCHIVE: ${{ steps.pack.outputs.archive }}

  publish-crate:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      # The action gets a short-lived crates.io token through OIDC. It
      # revokes the token when the job ends.
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
