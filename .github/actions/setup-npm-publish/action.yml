# Download the Wasm artifact and configure the npm registry.
name: Prepare npm publication
description: Download the Wasm artifact and configure Node.js for the npm registry.

inputs:
  registry-url:
    description: The URL of the npm registry.
    required: true
  scope:
    description: Optional package scope for the npm registry.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: wasm-package-dist
        path: .
        digest-mismatch: error
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".node-version"
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
